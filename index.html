<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym Timer" />
  <meta name="theme-color" content="#0f0f1a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Gym Timer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: #0f0f1a; }

    /* Force portrait orientation visually — when phone is rotated to landscape,
       counter-rotate the body so the WEITER button always points toward the
       charging port (i.e. the bottom of the screen in physical portrait). */
    body[data-rot="left"] {
      transform: rotate(-90deg);
      transform-origin: left top;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100vh;
      height: 100vw;
    }
    body[data-rot="right"] {
      transform: rotate(90deg);
      transform-origin: left top;
      position: absolute;
      top: 0;
      left: 100%;
      width: 100vh;
      height: 100vw;
    }

    body {
      background: #0f0f1a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 25px;
      padding: 16px 12px;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Only react to taps on actual buttons — non-button areas (background, timer
       display, counter text, hint, title) ignore touch input. */
    body * { pointer-events: none; }
    button   { pointer-events: auto; }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #e2e8f0;
    }

    /* Interval buttons */
    .intervals {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      justify-content: center;
      width: 100%;
    }

    .interval-btn {
      padding: 9px 12px;
      border-radius: 22px;
      border: 1.5px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }

    .interval-btn.active {
      border-color: #4ade80;
      background: #14532d;
      color: #4ade80;
    }

    .interval-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* Center stack: timer + button + counter — spans full body width so counter
       can anchor to the right edge in any orientation (avoids vw which is broken
       after CSS body rotation in landscape). */
    .center-stack {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
    }

    /* Set counter — vertically centered with the main button (bottom of center-stack),
       horizontally anchored to right edge of stack (= body right inset). */
    .set-counter {
      position: absolute;
      top: calc(100% - 95px); /* 95 = main-btn height / 2 → button center */
      right: 0;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .set-number {
      font-size: 56px;
      font-weight: 800;
      color: #facc15;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .set-label {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .reset-btn {
      margin-top: 2px;
      padding: 5px 10px;
      border-radius: 12px;
      border: 1.5px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .reset-btn:active { opacity: 0.7; }

    /* Timer (rounded rectangle) */
    .timer-circle {
      width: 280px;
      height: 160px;
      border-radius: 24px;
      border: 5px solid #334155;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s, background 0.3s;
    }

    .timer-circle.done {
      border-color: #4ade80;
      background: #14532d;
    }

    .timer-display {
      font-size: 80px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #e2e8f0;
      line-height: 1;
    }

    .timer-circle.done .timer-display {
      font-size: 64px;
      color: #4ade80;
    }

    .done-label {
      font-size: 18px;
      font-weight: 600;
      color: #4ade80;
      margin-top: 6px;
      display: none;
    }

    .timer-circle.done .done-label { display: block; }

    /* Main button */
    .main-btn {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #0f0f1a;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .main-btn:active { transform: scale(0.95); opacity: 0.85; }
    .main-btn.idle    { background: #4ade80; }
    .main-btn.running { background: #f87171; }
    .main-btn.paused  { background: #4ade80; }
    .main-btn.done    { background: #facc15; }

    .hint {
      font-size: 14px;
      color: #475569;
      height: 20px;
      text-align: center;
    }

  </style>
</head>
<body>

  <h1>Pause Timer</h1>

  <div class="intervals" id="intervals"></div>

  <p class="hint" id="hint">Wähle deine Pausenzeit</p>

  <div class="center-stack">
    <div class="timer-circle" id="timerCircle">
      <div class="timer-display" id="timerDisplay">01:00</div>
      <div class="done-label">Fertig!</div>
    </div>

    <button class="main-btn idle" id="mainBtn">START</button>

    <div class="set-counter">
      <div class="set-number" id="setNumber">1</div>
      <div class="set-label">Satz</div>
      <button class="reset-btn" id="resetBtn">Reset</button>
    </div>
  </div>

  <script>
    const INTERVALS = [
      { label: '30s', seconds: 30 },
      { label: '1 min', seconds: 60 },
      { label: '2 min', seconds: 120 },
      { label: '3 min', seconds: 180 },
      { label: '5 min', seconds: 300 },
    ];

    let selectedIndex = 1;
    let state = 'idle'; // idle | running | paused | done
    let remaining = INTERVALS[1].seconds;
    let endTime = null;          // wall-clock time when timer expires
    let tickInterval = null;
    let audioCtx = null;
    let setCount = 1;

    const intervalsEl = document.getElementById('intervals');
    const timerCircle = document.getElementById('timerCircle');
    const timerDisplay = document.getElementById('timerDisplay');
    const mainBtn = document.getElementById('mainBtn');
    const hint = document.getElementById('hint');
    const setNumber = document.getElementById('setNumber');

    // Build interval buttons
    INTERVALS.forEach((item, i) => {
      const btn = document.createElement('button');
      btn.className = 'interval-btn' + (i === selectedIndex ? ' active' : '');
      btn.textContent = item.label;
      btn.addEventListener('click', () => selectInterval(i));
      intervalsEl.appendChild(btn);
    });

    function getIntervalBtns() {
      return intervalsEl.querySelectorAll('.interval-btn');
    }

    function selectInterval(index) {
      if (state === 'running') return;
      if (state === 'done') setCount = 1;
      selectedIndex = index;
      getIntervalBtns().forEach((b, i) => b.classList.toggle('active', i === index));
      state = 'idle';
      remaining = INTERVALS[index].seconds;
      render();
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // iOS suspends the AudioContext when the page is backgrounded — resume it
      // before any playback so the signal still fires after an app switch.
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    function playBeepSound() {
      const ctx = ensureAudio();
      [0, 0.35, 0.70].forEach(offset => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.6, ctx.currentTime + offset);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.25);
        osc.start(ctx.currentTime + offset);
        osc.stop(ctx.currentTime + offset + 0.25);
      });
    }

    function playSignal() {
      try { playBeepSound(); } catch(e) {}
      if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
    }

    // Compute remaining seconds from wall-clock endTime so the timer keeps
     // counting correctly while the page is backgrounded (setInterval gets
     // throttled/paused on iOS Safari).
    function tick() {
      if (state !== 'running' || endTime === null) return;
      const newRemaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
      if (newRemaining !== remaining) {
        remaining = newRemaining;
        render();
      }
      if (newRemaining <= 0) {
        clearInterval(tickInterval);
        tickInterval = null;
        endTime = null;
        state = 'done';
        setCount++;
        getIntervalBtns().forEach(b => b.disabled = false);
        playSignal();
        render();
      }
    }

    function runTimerInterval() {
      clearInterval(tickInterval);
      tickInterval = setInterval(tick, 250);
    }

    function startTimer() {
      remaining = INTERVALS[selectedIndex].seconds;
      endTime = Date.now() + remaining * 1000;
      state = 'running';
      getIntervalBtns().forEach(b => b.disabled = true);
      render();
      runTimerInterval();
    }

    function pauseTimer() {
      clearInterval(tickInterval);
      tickInterval = null;
      // Snapshot remaining from wall clock so resume is accurate.
      if (endTime !== null) {
        remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
      }
      endTime = null;
      state = 'paused';
      getIntervalBtns().forEach(b => b.disabled = false);
      render();
    }

    function resumeTimer() {
      endTime = Date.now() + remaining * 1000;
      state = 'running';
      getIntervalBtns().forEach(b => b.disabled = true);
      render();
      runTimerInterval();
    }

    function render() {
      // Timer display
      if (state === 'done') {
        timerDisplay.textContent = '✓';
        timerCircle.className = 'timer-circle done';
      } else {
        timerDisplay.textContent = formatTime(remaining);
        timerCircle.className = 'timer-circle';
      }

      // Button
      mainBtn.className = 'main-btn ' + state;
      if (state === 'idle')    { mainBtn.textContent = 'START'; }
      if (state === 'running') { mainBtn.textContent = 'PAUSE';  }
      if (state === 'paused')  { mainBtn.textContent = 'WEITER'; }
      if (state === 'done')    { mainBtn.textContent = 'WEITER'; }

      // Hint
      if (state === 'idle')    hint.textContent = 'Wähle deine Pausenzeit';
      if (state === 'running') hint.textContent = 'Tippe PAUSE zum Anhalten';
      if (state === 'paused')  hint.textContent = 'Pausiert — tippe WEITER';
      if (state === 'done')    hint.textContent = 'Bereit für den nächsten Satz?';

      // Set counter
      setNumber.textContent = setCount;
    }

    mainBtn.addEventListener('click', () => {
      // Init AudioContext on first user gesture (required by browsers)
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      if (state === 'done')         startTimer();
      else if (state === 'idle')    startTimer();
      else if (state === 'running') pauseTimer();
      else if (state === 'paused')  resumeTimer();
    });

    // Reset counter button
    document.getElementById('resetBtn').addEventListener('click', () => {
      setCount = 1;
      render();
    });

    // Orientation handling — keep WEITER button pointing toward charging port
    function updateRotation() {
      // angle: 0 = portrait, 90 = rotated counter-clockwise (top tilts left),
      //       -90/270 = rotated clockwise (top tilts right), 180 = upside down
      let angle = 0;
      if (screen.orientation && typeof screen.orientation.angle === 'number') {
        angle = screen.orientation.angle;
      } else if (typeof window.orientation === 'number') {
        angle = window.orientation;
      }

      if (angle === 90) {
        document.body.dataset.rot = 'left';   // phone rotated left (charging port on right)
      } else if (angle === -90 || angle === 270) {
        document.body.dataset.rot = 'right';  // phone rotated right (charging port on left)
      } else {
        document.body.dataset.rot = 'portrait';
      }
    }
    window.addEventListener('orientationchange', updateRotation);
    window.addEventListener('resize', updateRotation);
    if (screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', updateRotation);
    }
    updateRotation();

    // Visibility handling — when returning from another app, resync the timer
    // and resume the audio context (iOS suspends both while backgrounded).
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      if (state === 'running') {
        // Force an immediate tick — if endTime already passed while we were
        // backgrounded, this transitions to 'done' and fires the signal now.
        tick();
        if (state === 'running') runTimerInterval();
      }
    });

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    render();
  </script>
</body>
</html>
