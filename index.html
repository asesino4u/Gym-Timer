<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym Timer" />
  <meta name="theme-color" content="#0f0f1a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Gym Timer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f1a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
      overflow: hidden;
      touch-action: manipulation;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #e2e8f0;
    }

    /* Interval buttons */
    .intervals {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .interval-btn {
      padding: 10px 18px;
      border-radius: 24px;
      border: 1.5px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .interval-btn.active {
      border-color: #4ade80;
      background: #14532d;
      color: #4ade80;
    }

    .interval-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* Timer circle */
    .timer-circle {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 5px solid #334155;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s, background 0.3s;
    }

    .timer-circle.done {
      border-color: #4ade80;
      background: #14532d;
    }

    .timer-display {
      font-size: 52px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #e2e8f0;
      line-height: 1;
    }

    .timer-circle.done .timer-display {
      font-size: 64px;
      color: #4ade80;
    }

    .done-label {
      font-size: 18px;
      font-weight: 600;
      color: #4ade80;
      margin-top: 6px;
      display: none;
    }

    .timer-circle.done .done-label { display: block; }

    /* Main button */
    .main-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #0f0f1a;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .main-btn:active { transform: scale(0.95); opacity: 0.85; }
    .main-btn.idle    { background: #4ade80; }
    .main-btn.running { background: #f87171; }
    .main-btn.done    { background: #facc15; }

    .hint {
      font-size: 14px;
      color: #475569;
      height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Pause Timer</h1>

  <div class="intervals" id="intervals"></div>

  <div class="timer-circle" id="timerCircle">
    <div class="timer-display" id="timerDisplay">01:00</div>
    <div class="done-label">Fertig!</div>
  </div>

  <button class="main-btn idle" id="mainBtn">START</button>

  <p class="hint" id="hint">Wähle deine Pausenzeit</p>

  <script>
    const INTERVALS = [
      { label: '30s', seconds: 30 },
      { label: '1 min', seconds: 60 },
      { label: '2 min', seconds: 120 },
      { label: '3 min', seconds: 180 },
      { label: '5 min', seconds: 300 },
    ];

    let selectedIndex = 1;
    let state = 'idle'; // idle | running | done
    let remaining = INTERVALS[1].seconds;
    let tickInterval = null;
    let audioCtx = null;

    const intervalsEl = document.getElementById('intervals');
    const timerCircle = document.getElementById('timerCircle');
    const timerDisplay = document.getElementById('timerDisplay');
    const mainBtn = document.getElementById('mainBtn');
    const hint = document.getElementById('hint');

    // Build interval buttons
    INTERVALS.forEach((item, i) => {
      const btn = document.createElement('button');
      btn.className = 'interval-btn' + (i === selectedIndex ? ' active' : '');
      btn.textContent = item.label;
      btn.addEventListener('click', () => selectInterval(i));
      intervalsEl.appendChild(btn);
    });

    function getIntervalBtns() {
      return intervalsEl.querySelectorAll('.interval-btn');
    }

    function selectInterval(index) {
      if (state === 'running') return;
      selectedIndex = index;
      getIntervalBtns().forEach((b, i) => b.classList.toggle('active', i === index));
      state = 'idle';
      remaining = INTERVALS[index].seconds;
      render();
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function playBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = audioCtx;

        // Three short beeps
        [0, 0.35, 0.70].forEach(offset => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.6, ctx.currentTime + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.25);
          osc.start(ctx.currentTime + offset);
          osc.stop(ctx.currentTime + offset + 0.25);
        });
      } catch(e) {}

      // Vibration fallback
      if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
    }

    function startTimer() {
      remaining = INTERVALS[selectedIndex].seconds;
      state = 'running';
      getIntervalBtns().forEach(b => b.disabled = true);
      render();

      tickInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          remaining = 0;
          clearInterval(tickInterval);
          state = 'done';
          playBeep();
        }
        render();
      }, 1000);
    }

    function stopTimer() {
      clearInterval(tickInterval);
      state = 'idle';
      remaining = INTERVALS[selectedIndex].seconds;
      getIntervalBtns().forEach(b => b.disabled = false);
      render();
    }

    function render() {
      // Timer display
      if (state === 'done') {
        timerDisplay.textContent = '✓';
        timerCircle.className = 'timer-circle done';
      } else {
        timerDisplay.textContent = formatTime(remaining);
        timerCircle.className = 'timer-circle';
      }

      // Button
      mainBtn.className = 'main-btn ' + state;
      if (state === 'idle')    { mainBtn.textContent = 'START'; }
      if (state === 'running') { mainBtn.textContent = 'STOP';  }
      if (state === 'done')    { mainBtn.textContent = 'WEITER'; }

      // Hint
      if (state === 'idle')    hint.textContent = 'Wähle deine Pausenzeit';
      if (state === 'running') hint.textContent = 'Tippe STOP um abzubrechen';
      if (state === 'done')    hint.textContent = 'Bereit für den nächsten Satz?';
    }

    mainBtn.addEventListener('click', () => {
      // Init AudioContext on first user gesture (required by browsers)
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      if (state === 'idle' || state === 'done') startTimer();
      else if (state === 'running') stopTimer();
    });

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    render();
  </script>
</body>
</html>
