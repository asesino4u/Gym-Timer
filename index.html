<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym Timer" />
  <meta name="theme-color" content="#0f0f1a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Gym Timer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: #0f0f1a; }

    /* Force portrait orientation visually — when phone is rotated to landscape,
       counter-rotate the body so the WEITER button always points toward the
       charging port (i.e. the bottom of the screen in physical portrait). */
    body[data-rot="left"] {
      transform: rotate(-90deg);
      transform-origin: left top;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100vh;
      height: 100vw;
    }
    body[data-rot="right"] {
      transform: rotate(90deg);
      transform-origin: left top;
      position: absolute;
      top: 0;
      left: 100%;
      width: 100vh;
      height: 100vw;
    }

    body {
      background: #0f0f1a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 25px;
      padding: 16px 12px;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Only react to taps on actual buttons — non-button areas (background, timer
       display, counter text, hint, title) ignore touch input. */
    h1, .timer-circle, .timer-display, .done-label,
    .set-number, .set-label, .hint {
      pointer-events: none;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #e2e8f0;
    }

    .version {
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      letter-spacing: 0;
      margin-left: 6px;
    }

    /* Interval buttons */
    .intervals {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      justify-content: center;
      width: 100%;
    }

    .interval-btn {
      padding: 9px 12px;
      border-radius: 22px;
      border: 1.5px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }

    .interval-btn.active {
      border-color: #4ade80;
      background: #14532d;
      color: #4ade80;
    }

    .interval-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* Center stack: timer + button + counter — spans full body width so counter
       can anchor to the right edge in any orientation (avoids vw which is broken
       after CSS body rotation in landscape). */
    .center-stack {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
    }

    /* Set counter — vertically centered with the main button (bottom of center-stack),
       horizontally anchored to right edge of stack (= body right inset). */
    .set-counter {
      position: absolute;
      top: calc(100% - 95px); /* 95 = main-btn height / 2 → button center */
      right: 0;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .set-number {
      font-size: 56px;
      font-weight: 800;
      color: #facc15;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .set-label {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .reset-btn {
      margin-top: 2px;
      padding: 5px 10px;
      border-radius: 12px;
      border: 1.5px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .reset-btn:active { opacity: 0.7; }

    /* Timer (rounded rectangle) */
    .timer-circle {
      width: 280px;
      height: 160px;
      border-radius: 24px;
      border: 5px solid #334155;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s, background 0.3s;
    }

    .timer-circle.done {
      border-color: #4ade80;
      background: #14532d;
    }

    .timer-display {
      font-size: 80px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #e2e8f0;
      line-height: 1;
    }

    .timer-circle.done .timer-display {
      font-size: 64px;
      color: #4ade80;
    }

    .done-label {
      font-size: 18px;
      font-weight: 600;
      color: #4ade80;
      margin-top: 6px;
      display: none;
    }

    .timer-circle.done .done-label { display: block; }

    /* Main button */
    .main-btn {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #0f0f1a;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .main-btn:active { transform: scale(0.95); opacity: 0.85; }
    .main-btn.idle    { background: #4ade80; }
    .main-btn.running { background: #f87171; }
    .main-btn.paused  { background: #4ade80; }
    .main-btn.done    { background: #facc15; }

    .hint {
      font-size: 14px;
      color: #475569;
      height: 20px;
      text-align: center;
    }

  </style>
</head>
<body>

  <h1>Pause Timer <span class="version">v1</span></h1>

  <div class="intervals" id="intervals"></div>

  <p class="hint" id="hint">Wähle deine Pausenzeit</p>

  <div class="center-stack">
    <div class="timer-circle" id="timerCircle">
      <div class="timer-display" id="timerDisplay">02:00</div>
      <div class="done-label">Fertig!</div>
    </div>

    <button class="main-btn idle" id="mainBtn">START</button>

    <div class="set-counter">
      <div class="set-number" id="setNumber">1</div>
      <div class="set-label">Satz</div>
      <button class="reset-btn" id="resetBtn">Reset</button>
    </div>
  </div>

  <script>
    // ────────────────────────────────────────────────────────────────────────
    // Config
    // ────────────────────────────────────────────────────────────────────────
    const INTERVALS = [
      { label: '30s',   seconds: 30  },
      { label: '1 min', seconds: 60  },
      { label: '2 min', seconds: 120 },
      { label: '3 min', seconds: 180 },
      { label: '5 min', seconds: 300 },
    ];
    const DEFAULT_INDEX = 2; // 2 min

    // Signal pattern: 3× 880 Hz, 250 ms Ton, 350 ms Start-zu-Start-Abstand
    // → 250 ms Ton + 100 ms Stille, dreimal.
    const BEEP_FREQ_HZ   = 880;
    const BEEP_DUR_S     = 0.25;
    const BEEP_GAP_S     = 0.10;   // 350 ms Abstand − 250 ms Ton = 100 ms Lücke
    const VIBRATE_PATTERN = [300, 100, 300, 100, 300];

    // ────────────────────────────────────────────────────────────────────────
    // State
    // ────────────────────────────────────────────────────────────────────────
    let selectedIndex = DEFAULT_INDEX;
    let state     = 'idle';                         // idle | running | paused | done
    let remaining = INTERVALS[DEFAULT_INDEX].seconds;
    let endTime   = null;                           // wall-clock ms when timer expires
    let tickInterval = null;
    let setCount = 1;

    // Audio
    let audioEl       = null;   // HTMLAudioElement — plays silence+beep WAV blob
    let audioBlobUrl  = null;   // current blob: URL, revoked on replace
    let audioUnlocked = false;  // true once media playback has been unlocked by user gesture

    // Wake lock
    let wakeLock = null;

    // DOM refs
    const intervalsEl   = document.getElementById('intervals');
    const timerCircle   = document.getElementById('timerCircle');
    const timerDisplay  = document.getElementById('timerDisplay');
    const mainBtn       = document.getElementById('mainBtn');
    const hint          = document.getElementById('hint');
    const setNumber     = document.getElementById('setNumber');

    // ────────────────────────────────────────────────────────────────────────
    // Interval pills
    // ────────────────────────────────────────────────────────────────────────
    INTERVALS.forEach((item, i) => {
      const btn = document.createElement('button');
      btn.className = 'interval-btn' + (i === selectedIndex ? ' active' : '');
      btn.textContent = item.label;
      btn.addEventListener('click', () => selectInterval(i));
      intervalsEl.appendChild(btn);
    });

    const getIntervalBtns = () => intervalsEl.querySelectorAll('.interval-btn');

    function selectInterval(index) {
      if (state === 'running') return;
      if (state === 'done') setCount = 1;
      selectedIndex = index;
      getIntervalBtns().forEach((b, i) => b.classList.toggle('active', i === index));
      state = 'idle';
      remaining = INTERVALS[index].seconds;
      stopAudio();
      render();
    }

    const formatTime = s => {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    };

    // ────────────────────────────────────────────────────────────────────────
    // Audio: generate a WAV blob containing `silentSeconds` of silence followed
    // by the 3× beep pattern, then play it via an <audio> element. iOS keeps
    // playing media elements in the background / with screen locked, so the
    // beep fires at the exact wall-clock time even when JS is throttled.
    // ────────────────────────────────────────────────────────────────────────
    function buildTimerAudioBlob(silentSeconds) {
      const sampleRate = 11025;
      const beepSamples = Math.floor(BEEP_DUR_S * sampleRate);
      const gapSamples  = Math.floor(BEEP_GAP_S * sampleRate);
      const silenceSamples = Math.max(0, Math.floor(silentSeconds * sampleRate));
      const totalSamples = silenceSamples + 3 * beepSamples + 2 * gapSamples;

      const bytesPerSample = 2;         // 16-bit PCM
      const dataSize = totalSamples * bytesPerSample;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      // RIFF/WAVE header
      const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);          // PCM fmt chunk size
      view.setUint16(20, 1, true);           // PCM format
      view.setUint16(22, 1, true);           // mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * bytesPerSample, true);
      view.setUint16(32, bytesPerSample, true);
      view.setUint16(34, 16, true);          // 16 bits per sample
      writeStr(36, 'data');
      view.setUint32(40, dataSize, true);

      // Silence section is already zero-filled by ArrayBuffer init.
      let offset = 44 + silenceSamples * bytesPerSample;

      const writeBeep = () => {
        for (let i = 0; i < beepSamples; i++) {
          const t = i / sampleRate;
          // 5 ms attack + exponential decay so the beep sounds clean, not clicky
          const env = t < 0.005 ? t / 0.005 : Math.exp(-(t - 0.005) * 8);
          const sample = Math.sin(2 * Math.PI * BEEP_FREQ_HZ * t) * env * 0.75;
          view.setInt16(offset, Math.max(-1, Math.min(1, sample)) * 32767, true);
          offset += 2;
        }
      };
      writeBeep(); offset += gapSamples * 2;
      writeBeep(); offset += gapSamples * 2;
      writeBeep();

      return new Blob([buffer], { type: 'audio/wav' });
    }

    function ensureAudioEl() {
      if (audioEl) return audioEl;
      audioEl = new Audio();
      audioEl.preload = 'auto';
      // playsInline keeps iOS from taking over the screen for "video"
      audioEl.playsInline = true;
      return audioEl;
    }

    // MUST be called from a user-gesture handler. Starts playback of a WAV
    // blob containing `silentSeconds` of silence + beep pattern.
    function playTimerAudio(silentSeconds) {
      const el = ensureAudioEl();
      try { el.pause(); } catch(e) {}
      if (audioBlobUrl) { try { URL.revokeObjectURL(audioBlobUrl); } catch(e) {} }

      const blob = buildTimerAudioBlob(silentSeconds);
      audioBlobUrl = URL.createObjectURL(blob);
      el.src = audioBlobUrl;
      el.currentTime = 0;

      const p = el.play();
      if (p && p.then) {
        p.then(() => { audioUnlocked = true; })
         .catch(() => { /* iOS silently rejected — unlock still marked false */ });
      }
    }

    function stopAudio() {
      if (!audioEl) return;
      try { audioEl.pause(); } catch(e) {}
      try { audioEl.removeAttribute('src'); audioEl.load(); } catch(e) {}
      if (audioBlobUrl) { try { URL.revokeObjectURL(audioBlobUrl); } catch(e) {} audioBlobUrl = null; }
    }

    // ────────────────────────────────────────────────────────────────────────
    // Wake Lock — must be requested inside a user gesture on iOS Safari.
    // ────────────────────────────────────────────────────────────────────────
    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      if (document.visibilityState !== 'visible') return;
      if (wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } catch(e) { /* denied without user gesture or OS-level block */ }
    }

    function releaseWakeLock() {
      if (!wakeLock) return;
      try { wakeLock.release(); } catch(e) {}
      wakeLock = null;
    }

    // ────────────────────────────────────────────────────────────────────────
    // Timer loop — wall-clock based so it stays correct through JS throttling.
    // ────────────────────────────────────────────────────────────────────────
    function tick() {
      if (state !== 'running' || endTime === null) return;
      const newRemaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
      if (newRemaining !== remaining) {
        remaining = newRemaining;
        render();
      }
      if (newRemaining <= 0) finishTimer();
    }

    function finishTimer() {
      clearInterval(tickInterval);
      tickInterval = null;
      const expiredAt = endTime;
      endTime = null;
      state = 'done';
      setCount++;
      getIntervalBtns().forEach(b => b.disabled = false);

      // Vibrate only if the timer just expired now (within ~2 s). If the user
      // comes back long after expiry, the audio file already played — don't
      // add a late, jarring vibration.
      const sinceExpiryMs = Date.now() - (expiredAt || Date.now());
      if (sinceExpiryMs < 2000 && navigator.vibrate) {
        navigator.vibrate(VIBRATE_PATTERN);
      }
      render();
      releaseWakeLock();
    }

    function runTicker() {
      clearInterval(tickInterval);
      tickInterval = setInterval(tick, 250);
    }

    // ────────────────────────────────────────────────────────────────────────
    // START / PAUSE / WEITER — every state transition happens inside a
    // user-gesture click handler so both audio.play() and wakeLock.request()
    // are allowed on iOS.
    // ────────────────────────────────────────────────────────────────────────
    function startTimer() {
      remaining = INTERVALS[selectedIndex].seconds;
      endTime = Date.now() + remaining * 1000;
      state = 'running';
      getIntervalBtns().forEach(b => b.disabled = true);
      render();
      runTicker();

      playTimerAudio(remaining);
      requestWakeLock();
    }

    function pauseTimer() {
      clearInterval(tickInterval);
      tickInterval = null;
      if (endTime !== null) {
        remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
      }
      endTime = null;
      state = 'paused';
      getIntervalBtns().forEach(b => b.disabled = false);
      stopAudio();
      render();
      // Wake Lock behalten wir im Paused-State ebenfalls bei — Nutzer könnte
      // gerade auf den Timer blicken. Freigabe erst bei neuem Intervall oder
      // Fertig.
    }

    function resumeTimer() {
      endTime = Date.now() + remaining * 1000;
      state = 'running';
      getIntervalBtns().forEach(b => b.disabled = true);
      render();
      runTicker();

      playTimerAudio(remaining);
      requestWakeLock();
    }

    // ────────────────────────────────────────────────────────────────────────
    // Render
    // ────────────────────────────────────────────────────────────────────────
    function render() {
      if (state === 'done') {
        timerDisplay.textContent = '✓';
        timerCircle.className = 'timer-circle done';
      } else {
        timerDisplay.textContent = formatTime(remaining);
        timerCircle.className = 'timer-circle';
      }

      mainBtn.className = 'main-btn ' + state;
      if (state === 'idle')    mainBtn.textContent = 'START';
      if (state === 'running') mainBtn.textContent = 'PAUSE';
      if (state === 'paused')  mainBtn.textContent = 'WEITER';
      if (state === 'done')    mainBtn.textContent = 'WEITER';

      if (state === 'idle')    hint.textContent = 'Wähle deine Pausenzeit';
      if (state === 'running') hint.textContent = 'Tippe PAUSE zum Anhalten';
      if (state === 'paused')  hint.textContent = 'Pausiert — tippe WEITER';
      if (state === 'done')    hint.textContent = 'Bereit für den nächsten Satz?';

      setNumber.textContent = setCount;
    }

    // ────────────────────────────────────────────────────────────────────────
    // Main button — single click handler, stays within one user gesture
    // ────────────────────────────────────────────────────────────────────────
    mainBtn.addEventListener('click', () => {
      if (state === 'running')      pauseTimer();
      else if (state === 'paused')  resumeTimer();
      else                          startTimer(); // idle | done
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      setCount = 1;
      render();
    });

    // ────────────────────────────────────────────────────────────────────────
    // Orientation — counter-rotate body so WEITER points toward charging port
    // ────────────────────────────────────────────────────────────────────────
    function updateRotation() {
      let angle = 0;
      if (screen.orientation && typeof screen.orientation.angle === 'number') {
        angle = screen.orientation.angle;
      } else if (typeof window.orientation === 'number') {
        angle = window.orientation;
      }
      if (angle === 90)                              document.body.dataset.rot = 'left';
      else if (angle === -90 || angle === 270)       document.body.dataset.rot = 'right';
      else                                           document.body.dataset.rot = 'portrait';
    }
    window.addEventListener('orientationchange', updateRotation);
    window.addEventListener('resize', updateRotation);
    if (screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', updateRotation);
    }
    updateRotation();

    // ────────────────────────────────────────────────────────────────────────
    // Visibility — when returning from another app or screen-on:
    //   • force a tick so an already-expired timer transitions to 'done'
    //     (ohne späten Beep — der WAV-Lauf hat den Beep bereits selbst erzeugt)
    //   • re-acquire the wake lock (browser released it on hide)
    // ────────────────────────────────────────────────────────────────────────
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (state === 'running') {
        tick();
        if (state === 'running') {
          runTicker();
          requestWakeLock();
        }
      } else if (state === 'paused') {
        requestWakeLock();
      }
    });

    // ────────────────────────────────────────────────────────────────────────
    // Service Worker
    // ────────────────────────────────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    render();
  </script>
</body>
</html>
