<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym Timer" />
  <meta name="theme-color" content="#0f0f1a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Gym Timer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f1a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      gap: 12px;
      padding: 16px 12px;
      overflow: hidden;
      touch-action: manipulation;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #e2e8f0;
    }

    /* Interval buttons */
    .intervals {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      justify-content: center;
      width: 100%;
    }

    .interval-btn {
      padding: 9px 12px;
      border-radius: 22px;
      border: 1.5px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }

    .interval-btn.active {
      border-color: #4ade80;
      background: #14532d;
      color: #4ade80;
    }

    .interval-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* Center stack: timer + button + counter */
    .center-stack {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* Set counter — absolutely positioned within center-stack:
       vertically centered between timer and main button, anchored to viewport right edge */
    .set-counter {
      position: absolute;
      top: 50%;
      right: calc(50% - 50vw + 12px);
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .set-number {
      font-size: 56px;
      font-weight: 800;
      color: #facc15;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .set-label {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .reset-btn {
      margin-top: 2px;
      padding: 5px 10px;
      border-radius: 12px;
      border: 1.5px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .reset-btn:active { opacity: 0.7; }

    /* Timer circle */
    .timer-circle {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 5px solid #334155;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s, background 0.3s;
    }

    .timer-circle.done {
      border-color: #4ade80;
      background: #14532d;
    }

    .timer-display {
      font-size: 46px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #e2e8f0;
      line-height: 1;
    }

    .timer-circle.done .timer-display {
      font-size: 56px;
      color: #4ade80;
    }

    .done-label {
      font-size: 18px;
      font-weight: 600;
      color: #4ade80;
      margin-top: 6px;
      display: none;
    }

    .timer-circle.done .done-label { display: block; }

    /* Main button */
    .main-btn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #0f0f1a;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .main-btn:active { transform: scale(0.95); opacity: 0.85; }
    .main-btn.idle    { background: #4ade80; }
    .main-btn.running { background: #f87171; }
    .main-btn.done    { background: #facc15; }

    .hint {
      font-size: 14px;
      color: #475569;
      height: 20px;
      text-align: center;
    }

    /* Sound selector */
    .sound-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .sound-label {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .sound-options {
      display: flex;
      gap: 8px;
    }

    .sound-btn {
      padding: 7px 11px;
      border-radius: 18px;
      border: 1.5px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }

    .sound-btn.active {
      border-color: #facc15;
      background: #422006;
      color: #facc15;
    }
  </style>
</head>
<body>

  <h1>Pause Timer</h1>

  <div class="intervals" id="intervals"></div>

  <div class="center-stack">
    <div class="timer-circle" id="timerCircle">
      <div class="timer-display" id="timerDisplay">01:00</div>
      <div class="done-label">Fertig!</div>
    </div>

    <button class="main-btn idle" id="mainBtn">START</button>

    <div class="set-counter">
      <div class="set-number" id="setNumber">1</div>
      <div class="set-label">Satz</div>
      <button class="reset-btn" id="resetBtn">Reset</button>
    </div>
  </div>

  <p class="hint" id="hint">Wähle deine Pausenzeit</p>

  <div class="sound-section">
    <div class="sound-label">Signal</div>
    <div class="sound-options" id="soundOptions">
      <button class="sound-btn active" data-sound="beep">Beep</button>
      <button class="sound-btn" data-sound="bell">Glocke</button>
      <button class="sound-btn" data-sound="microwave">Mikrowelle</button>
      <button class="sound-btn" data-sound="voice">Stimme</button>
    </div>
  </div>

  <script>
    const INTERVALS = [
      { label: '30s', seconds: 30 },
      { label: '1 min', seconds: 60 },
      { label: '2 min', seconds: 120 },
      { label: '3 min', seconds: 180 },
      { label: '5 min', seconds: 300 },
    ];

    let selectedIndex = 1;
    let state = 'idle'; // idle | running | done
    let remaining = INTERVALS[1].seconds;
    let tickInterval = null;
    let audioCtx = null;
    let setCount = 1;
    let soundType = localStorage.getItem('gymTimerSound') || 'beep';

    const intervalsEl = document.getElementById('intervals');
    const timerCircle = document.getElementById('timerCircle');
    const timerDisplay = document.getElementById('timerDisplay');
    const mainBtn = document.getElementById('mainBtn');
    const hint = document.getElementById('hint');
    const setNumber = document.getElementById('setNumber');

    // Build interval buttons
    INTERVALS.forEach((item, i) => {
      const btn = document.createElement('button');
      btn.className = 'interval-btn' + (i === selectedIndex ? ' active' : '');
      btn.textContent = item.label;
      btn.addEventListener('click', () => selectInterval(i));
      intervalsEl.appendChild(btn);
    });

    function getIntervalBtns() {
      return intervalsEl.querySelectorAll('.interval-btn');
    }

    function selectInterval(index) {
      if (state === 'running') return;
      if (state === 'done') setCount = 1;
      selectedIndex = index;
      getIntervalBtns().forEach((b, i) => b.classList.toggle('active', i === index));
      state = 'idle';
      remaining = INTERVALS[index].seconds;
      render();
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playBeepSound() {
      const ctx = ensureAudio();
      [0, 0.35, 0.70].forEach(offset => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.6, ctx.currentTime + offset);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.25);
        osc.start(ctx.currentTime + offset);
        osc.stop(ctx.currentTime + offset + 0.25);
      });
    }

    function playBellSound() {
      const ctx = ensureAudio();
      // Boxing bell: two strikes, each a mix of frequencies with long decay
      [0, 0.45].forEach(offset => {
        [440, 880, 1320, 1760].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = i === 0 ? 'triangle' : 'sine';
          osc.frequency.value = freq;
          const peak = 0.4 / (i + 1);
          gain.gain.setValueAtTime(peak, ctx.currentTime + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 1.2);
          osc.start(ctx.currentTime + offset);
          osc.stop(ctx.currentTime + offset + 1.2);
        });
      });
    }

    function playMicrowaveSound() {
      const ctx = ensureAudio();
      // 4 short sharp beeps, square wave for digital character
      [0, 0.28, 0.56, 0.84].forEach(offset => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'square';
        osc.frequency.value = 2000;
        gain.gain.setValueAtTime(0.0, ctx.currentTime + offset);
        gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + offset + 0.005);
        gain.gain.setValueAtTime(0.25, ctx.currentTime + offset + 0.10);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.13);
        osc.start(ctx.currentTime + offset);
        osc.stop(ctx.currentTime + offset + 0.13);
      });
    }

    function playVoiceSound() {
      try {
        const utter = new SpeechSynthesisUtterance('Pause vorbei');
        utter.lang = 'de-DE';
        utter.rate = 1;
        utter.pitch = 1;
        speechSynthesis.speak(utter);
      } catch(e) {}
    }

    function playSignal() {
      try {
        if (soundType === 'beep')      playBeepSound();
        if (soundType === 'bell')      playBellSound();
        if (soundType === 'microwave') playMicrowaveSound();
        if (soundType === 'voice')     playVoiceSound();
      } catch(e) {}

      if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
    }

    function startTimer() {
      remaining = INTERVALS[selectedIndex].seconds;
      state = 'running';
      getIntervalBtns().forEach(b => b.disabled = true);
      render();

      tickInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          remaining = 0;
          clearInterval(tickInterval);
          state = 'done';
          getIntervalBtns().forEach(b => b.disabled = false);
          playSignal();
        }
        render();
      }, 1000);
    }

    function stopTimer() {
      clearInterval(tickInterval);
      state = 'idle';
      remaining = INTERVALS[selectedIndex].seconds;
      getIntervalBtns().forEach(b => b.disabled = false);
      render();
    }

    function render() {
      // Timer display
      if (state === 'done') {
        timerDisplay.textContent = '✓';
        timerCircle.className = 'timer-circle done';
      } else {
        timerDisplay.textContent = formatTime(remaining);
        timerCircle.className = 'timer-circle';
      }

      // Button
      mainBtn.className = 'main-btn ' + state;
      if (state === 'idle')    { mainBtn.textContent = 'START'; }
      if (state === 'running') { mainBtn.textContent = 'STOP';  }
      if (state === 'done')    { mainBtn.textContent = 'WEITER'; }

      // Hint
      if (state === 'idle')    hint.textContent = 'Wähle deine Pausenzeit';
      if (state === 'running') hint.textContent = 'Tippe STOP um abzubrechen';
      if (state === 'done')    hint.textContent = 'Bereit für den nächsten Satz?';

      // Set counter
      setNumber.textContent = setCount;
    }

    mainBtn.addEventListener('click', () => {
      // Init AudioContext on first user gesture (required by browsers)
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      if (state === 'done') { setCount++; startTimer(); }
      else if (state === 'idle') startTimer();
      else if (state === 'running') stopTimer();
    });

    // Reset counter button
    document.getElementById('resetBtn').addEventListener('click', () => {
      setCount = 1;
      render();
    });

    // Sound selector
    const soundOptions = document.getElementById('soundOptions');
    function applySoundSelection() {
      soundOptions.querySelectorAll('.sound-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.sound === soundType));
    }
    soundOptions.addEventListener('click', e => {
      const btn = e.target.closest('.sound-btn');
      if (!btn) return;
      soundType = btn.dataset.sound;
      localStorage.setItem('gymTimerSound', soundType);
      applySoundSelection();
      ensureAudio();
      playSignal(); // preview
    });
    applySoundSelection();

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    render();
  </script>
</body>
</html>
